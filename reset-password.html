<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b12"><title>Reset Password | RGC Events Community</title>
<style>
:root{color-scheme:dark;--line:#572435;--red:#ed2347;--muted:#9aa9c0;--text:#f7f4f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#29111c 0,transparent 48%),#090a10;font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}main{width:min(100%,560px);padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1b141d,#101018);box-shadow:0 24px 80px #0008}.eyebrow{margin:0 0 8px;color:#ff526d;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 10px;font-size:clamp(28px,6vw,38px);line-height:1.12;letter-spacing:-.03em}.intro{margin:0 0 26px;color:#aab9ce}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:800;letter-spacing:.06em}input{width:100%;padding:14px 15px;border:1px solid #394052;border-radius:12px;background:#0b0d14;color:white;font:inherit;outline:none}input:focus{border-color:#ed2347;box-shadow:0 0 0 3px #ed234722}button{width:100%;margin-top:22px;padding:14px 18px;border:0;border-radius:12px;background:linear-gradient(100deg,#f0274c,#b70d32);color:white;font:800 15px/1.2 inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{display:none;margin-top:18px;padding:13px 15px;border:1px solid #394052;border-radius:11px;color:#c9d5e6;overflow-wrap:anywhere}.message.show{display:block}.message.error{border-color:#a52a46;color:#ffb9c6}.fine{margin:22px 0 0;color:#8292aa;font-size:13px}form[hidden]{display:none!important}
</style></head><body><main><p class="eyebrow">RGC Events Community</p><h1 id="heading">Reset your password</h1><p class="intro" id="intro">Use your registered email address to receive a secure password-reset link.</p>
<form id="requestForm"><label for="email">REGISTERED EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" required placeholder="Enter your account email"><button id="requestBtn" type="submit">Send password reset link</button></form>
<form id="updateForm" hidden><label for="password">NEW PASSWORD</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"><label for="confirm">CONFIRM NEW PASSWORD</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Re-enter your new password"><button id="updateBtn" type="submit">Update password</button></form>
<div id="message" class="message" role="status" aria-live="polite"></div><p class="fine">Your password is handled securely by Supabase Authentication. This page does not store or display your password.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';
const SUPABASE_URL='https://nbabfwiaeapodmimhsic.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_XgRnSpNwrV9xTmVE08zo0g_yky8O0T0';
const REDIRECT_URL='https://rgcasiaevents.github.io/community-dashboard/reset-password.html';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const requestForm=document.getElementById('requestForm'),updateForm=document.getElementById('updateForm'),heading=document.getElementById('heading'),intro=document.getElementById('intro'),message=document.getElementById('message'),requestBtn=document.getElementById('requestBtn'),updateBtn=document.getElementById('updateBtn');
function showMessage(text,isError=false){message.textContent=text;message.className='message show'+(isError?' error':'')}
function recoveryForm(){requestForm.hidden=true;updateForm.hidden=false;heading.textContent='Choose a new password';intro.textContent='Your recovery link has been accepted. Enter and confirm your new password.'}
function readableError(error){const t=String(error?.message||error||'');if(/expired|invalid|otp/i.test(t))return'This reset link is invalid or has expired. Request a new reset link below.';return t||'Something went wrong. Please try again.'}
requestForm.addEventListener('submit',async e=>{e.preventDefault();requestBtn.disabled=true;requestBtn.textContent='Sending…';message.className='message';try{const email=document.getElementById('email').value.trim();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT_URL});if(error)throw error;showMessage('If this email belongs to an account, Supabase will send a password-reset link. Open the newest email and use its link on this page.')}catch(error){showMessage(readableError(error),true)}finally{requestBtn.disabled=false;requestBtn.textContent='Send password reset link'}});
updateForm.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password.length<8)return showMessage('Your password must contain at least 8 characters.',true);if(password!==confirm)return showMessage('The passwords do not match. Please check both fields.',true);updateBtn.disabled=true;updateBtn.textContent='Updating…';try{const {error}=await sb.auth.updateUser({password});if(error)throw error;showMessage('Your password has been updated successfully. Return to the RGC dashboard and sign in using your new password.');updateForm.hidden=true;heading.textContent='Password updated';intro.textContent='Your RGC account password has been changed.';await sb.auth.signOut();history.replaceState({},document.title,location.origin+location.pathname)}catch(error){showMessage(readableError(error),true)}finally{updateBtn.disabled=false;updateBtn.textContent='Update password'}});
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(session&&location.hash.includes('type=recovery'))){recoveryForm();showMessage('Recovery link verified. You may now set a new password.')}});
(async()=>{const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search),errorCode=hash.get('error_code')||query.get('error_code');if(errorCode){showMessage(readableError(hash.get('error_description')||errorCode),true);return}const tokenHash=query.get('token_hash');if(tokenHash&&query.get('type')==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});if(error){showMessage(readableError(error),true);return}recoveryForm();showMessage('Recovery link verified. You may now set a new password.');return}const {data:{session}}=await sb.auth.getSession();if(session&&(hash.get('type')==='recovery'||hash.has('access_token'))){recoveryForm();showMessage('Recovery link verified. You may now set a new password.')}})();
})();
</script></body></html>
