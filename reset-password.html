<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b12">
  <title>Reset Password | RGC Events Community</title>
  <style>
    :root{color-scheme:dark;--bg:#090910;--panel:#17121b;--line:#56303d;--muted:#9ba8c0;--pink:#ed2448;--pink2:#b90d30;--field:#0b0d15}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#25121d 0,transparent 55%),var(--bg);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7f3f5}
    main{width:min(100%,520px);padding:36px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1b141d,#101018);box-shadow:0 24px 80px #0008}
    .eyebrow{margin:0 0 8px;color:#ff526d;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 8px;font-size:clamp(28px,6vw,38px);line-height:1.15}p{color:var(--muted)}label{display:block;margin:20px 0 7px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}input{width:100%;padding:14px 15px;border:1px solid #394052;border-radius:12px;background:var(--field);color:white;font:inherit;outline:none}input:focus{border-color:#ed2448;box-shadow:0 0 0 3px #ed244822}button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;background:linear-gradient(100deg,var(--pink),var(--pink2));color:white;font:700 16px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{display:none;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:#f4cbd3;background:#2a141e}.message.show{display:block}.hint{font-size:13px;margin-top:18px}.hidden{display:none!important}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">RGC Events Community</p>
    <h1>Set a new password</h1>
    <p>Choose a new password for your RGC account. This page is only for password recovery.</p>
    <form id="resetForm" class="hidden">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Re-enter your new password">
      <button id="submitButton" type="submit">Update password</button>
    </form>
    <div id="message" class="message show" role="status" aria-live="polite">Checking your password recovery link…</div>
    <p class="hint">For your security, use a password you do not use on other websites.</p>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://nbabfwiaeapodmimhsic.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_XgRnSpNwrV9xTmVE08zo0g_yky8O0T0';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
    });

    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');
    let recoveryReady = false;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.add('show');
      message.style.borderColor = isError ? '#b92b48' : '#56303d';
    }

    async function initializeRecovery() {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type');

      if (tokenHash && type === 'recovery') {
        const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
        if (error) throw error;
      }

      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (!data.session) {
        throw new Error('This recovery link is missing, expired, or has already been used. Request a new password recovery email.');
      }

      recoveryReady = true;
      form.classList.remove('hidden');
      message.classList.remove('show');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!recoveryReady) return;
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (password.length < 8) return showMessage('Please use at least 8 characters.', true);
      if (password !== confirmation) return showMessage('The passwords do not match. Please check them and try again.', true);

      button.disabled = true;
      button.textContent = 'Updating password…';
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        form.classList.add('hidden');
        showMessage('Your password has been updated successfully. You can now return to the RGC dashboard and sign in with your new password.');
        await supabase.auth.signOut();
      } catch (error) {
        showMessage(error?.message || 'Unable to update your password. Please request a new recovery link.', true);
        button.disabled = false;
        button.textContent = 'Update password';
      }
    });

    initializeRecovery().catch((error) => {
      showMessage(error?.message || 'Unable to verify this recovery link. Please request a new one.', true);
    });
  </script>
</body>
</html>
